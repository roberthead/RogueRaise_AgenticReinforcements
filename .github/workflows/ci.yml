# Continuous integration for Rogue Raise.
#
# This exists because the project relies on *structural* tests to hold its
# conventions in place — `src/lib/rogue-raise/admin/coverage.test.ts` fails the
# build when a privileged server action skips its guard, and the design-system
# guardrails added by the redesign story do the same for tokens and containers.
# A guardrail nothing runs is decoration, so this workflow is a prerequisite for
# every convention the codebase claims to enforce.
#
# No database is required: all tests are pure-logic and run in vitest's node
# environment in a few seconds. If integration tests against Postgres are added
# later, give them a separate job with a `services: postgres` block rather than
# slowing this one down.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `install`) so the lockfile is authoritative and a drifted
      # lockfile fails here rather than silently resolving to different versions.
      - name: Install dependencies
        run: npm ci

      # Each step runs even if an earlier one failed, so a single push reports
      # every problem at once instead of one per round trip.
      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Test
        if: '!cancelled()'
        run: npm run test
